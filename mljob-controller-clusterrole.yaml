apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mljob-controller-clusterrole
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["ai.mljob-controller"]
    resources: ["mljobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"] 
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mljob-controller-binding
subjects:
  - kind: ServiceAccount
    name: mljob-controller-sa
    namespace: sumin
roleRef:
  kind: ClusterRole
  name: mljob-controller-clusterrole
  apiGroup: rbac.authorization.k8s.io

