apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mljobs.ai.mljob-controller
spec:
  group: ai.mljob-controller
  names:
    kind: MLJob
    listKind: MLJobList
    plural: mljobs
    singular: mljob
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                cpu:
                  type: string
                checkpointPath:
                  type: string
                queueName:
                  type: string
            status:
              type: object
              properties:
                admission:
                  type: object
                  properties:
                    # ClusterQueue는 승인된 워크로드를 나타냄
                    clusterQueue:
                      type: string
                    # PodSetAssignments는 각 PodSet의 승인 결과를 포함
                    podSetAssignments:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          count:
                            type: integer
                    # 승인 상태를 나타내는 Granted 필드 추가
                    granted:
                      type: boolean

